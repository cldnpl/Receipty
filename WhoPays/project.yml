name: ChiPaga
options:
  bundleIdPrefix: com.cldnpl
  developmentLanguage: it
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: H4M7KJL5DT
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ChiPaga:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Chi paga?
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - Inter-ExtraBold.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSCameraUsageDescription: Serve per fotografare lo scontrino e leggere articoli e prezzi. La foto resta sul telefono.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Light
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cldnpl.chipaga
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ChiPagaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: ChiPaga
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.cldnpl.chipaga.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ChiPaga.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ChiPaga
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  ChiPaga:
    build:
      targets:
        ChiPaga: all
        ChiPagaTests: [test]
    run:
      config: Debug
    test:
      targets:
        - ChiPagaTests
    archive:
      config: Release
