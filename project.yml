name: Receipty
options:
  bundleIdPrefix: com.cldnpl
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: H4M7KJL5DT
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Receipty:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Receipty
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - Inter-ExtraBold.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSCameraUsageDescription: Receipty uses the camera to read the items and prices on your receipt. The photo never leaves your phone.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cldnpl.whopays
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ReceiptyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Receipty
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.cldnpl.whopays.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Receipty.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Receipty
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Receipty:
    build:
      targets:
        Receipty: all
        ReceiptyTests: [test]
    run:
      config: Debug
    test:
      targets:
        - ReceiptyTests
    archive:
      config: Release
